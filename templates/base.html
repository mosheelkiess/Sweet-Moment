<body>
    <header>
        
        <div class="logo-container">
            <img src="/static/images/logo2.jpg" class="logo" alt="Sweet Moment Logo">
        </div>
        <nav>
            <ul>
                <li><a href="/">בית</a></li>
                <li><a href="/cakes">העוגות שלנו</a></li>

    </header>
    <main>
        
            <section class="contact-section">
                <h1>צור קשר</h1>
                <form action="/contact" method="POST" class="contact-form">
                    <label for="name">שם:</label>
                    <input type="text" id="name" name="name" placeholder="הכנס את שמך" required>
                    
                    <label for="email">אימייל:</label>
                    <input type="email" id="email" name="email" placeholder="הכנס את כתובת האימייל" required>

                    <label for="phone">טלפון:</label>
                <input type="tel" id="phone" name="phone" placeholder="הכנס את מספר הטלפון" pattern="[0-9]{10}" required>
                
                    
                    <label for="message">הודעה:</label>
                    <textarea id="message" name="message" placeholder="כתוב את ההודעה שלך כאן..." required></textarea>
                    
                    <button type="submit">שלח</button>


                    <a href="https://wa.me/972586699031?text=שלום,%20ברצוני%20לברר%20מידע%20על%20העוגות%20שלכם" 
   target="_blank" 
   style="padding: 10px 20px; background-color: #25d366; color: white; text-decoration: none; border-radius: 5px;">
   שלח הודעה לבית העסק - WhatsApp
</a>

         
            
      
                </section>
    </main>
   
    <div class="social-icons">
        <a href="https://facebook.com" class="facebook" target="_blank">

        <a href="https://instagram.com" class="instagram" target="_blank">

        </a>
    
        </a>
        <a href="https://wa.me/972586699030?text=שלום,%20אני%20מעוניין%20לצפות%20בסטטוס!" class="whatsapp" target="_blank">
            <i class="fab fa-whatsapp"></i> <!-- אייקון וואטסאפ -->
        </a>
    </div>
